name: Final ACKit Optimize docs cleanup

on:
  push:
    paths:
      - .github/workflows/cleanup-optimize-docs.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Normalize remaining Optimize documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '## Active snapshot — ACKit Optimize development ACKit Optimize (2026-07-18)': '## Active snapshot — ACKit Optimize (2026-07-18)',
              'Optimize is current-source Optimize work until a separate human-controlled release decision.': 'Optimize is current-source functionality until a separate human-controlled release decision.',
              '| BW1 |': '| OPT1 |',
              '| BW2 |': '| OPT2 |',
              '| BW3 |': '| OPT3 |',
              '| BW4 |': '| OPT4 |',
              '| BW5 |': '| OPT5 |',
              'Public attribution/evidence, reproducible judging, full local/hosted closure': 'Public documentation/evidence, reproducible validation, full local/hosted closure',
              'judging': 'validation',
              'Judging': 'Validation',
          }

          changed = []
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              original = path.read_text(encoding='utf-8')
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed.append(path.as_posix())

          print('Changed Markdown files:')
          for item in changed:
              print(f'  {item}')
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nF 'ACKit Optimize development ACKit Optimize' -- '*.md'; then
            echo 'Duplicated Optimize heading remains.' >&2
            exit 1
          fi
          if git grep -nF 'current-source Optimize work' -- '*.md'; then
            echo 'Awkward Optimize wording remains.' >&2
            exit 1
          fi
          if git grep -nE '\| BW[1-5] \|' -- '*.md'; then
            echo 'Legacy BW queue identifiers remain.' >&2
            exit 1
          fi
          if git grep -ni 'judging' -- '*.md'; then
            echo 'Legacy judging terminology remains.' >&2
            exit 1
          fi
          if git grep -nEi 'Build Week|build-week|BUILD_WEEK_2026' -- '*.md'; then
            echo 'Legacy Build Week terminology remains.' >&2
            exit 1
          fi
          git diff --check

      - name: Validate Markdown links
        shell: pwsh
        run: ./scripts/check-local-markdown-links.ps1

      - name: Commit cleanup directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/cleanup-optimize-docs.yml
          git add -u -- '*.md'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'docs: polish ACKit Optimize internal documentation'
          git push origin HEAD:master
