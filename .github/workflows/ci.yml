name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.os }} / node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v4 (f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a)
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      # actions/setup-node@v4 (ae0d4ed08881f17d1511386f5be3e62356acd4a6)
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: ${{ matrix.node }}
      # pnpm/action-setup@v4 (b906affcce14559ad1aafd4ab0e942779e9f58b1)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Schema drift
        run: |
          pnpm gen:schemas
          git diff --exit-code -- schemas
      - name: CLI smoke
        run: pnpm smoke:cli
      - name: Version parity
        run: node scripts/check-version-parity.mjs
      - name: Offline-egress static gate
        run: node scripts/check-offline-egress.mjs
      - name: Text hygiene (C0 controls)
        run: node scripts/check-text-hygiene.mjs --repo
      - name: Tests (unit/integration/contract/security)
        run: pnpm test

  self-scan:
    name: self-scan (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Doctor equivalent (config + tasks integrity)
        run: |
          node dist/cli/index.js config check
          node dist/cli/index.js task doctor
      - name: Self-scan with threshold gate
        run: node dist/cli/index.js scan --ci

  package-smoke:
    name: package-smoke ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Tarball install + installed-CLI smoke
        run: pnpm run smoke:package

  extension:
    name: extension / node-22 (vsce + Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - name: Frozen install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build root (for SDK)
        run: pnpm build
      - name: Extension manifest contract
        run: |
          node -e "
          const pkg=require('./extensions/vscode/package.json');
          const root=require('./package.json');
          if(pkg.version!==root.version) throw new Error('extension/root version mismatch');
          if(pkg.publisher!=='Cynrath') throw new Error('publisher must be Cynrath');
          if(pkg.displayName!=='ACKit Toolkit') throw new Error('displayName must be ACKit Toolkit');
          if(!pkg.contributes.views.ackit.find(v=>v.id==='ackit.readiness')) throw new Error('ackit.readiness view missing');
          if(!pkg.contributes.views.ackit.find(v=>v.id==='ackit.findings')) throw new Error('ackit.findings view missing');
          if(!pkg.contributes.views.ackit.find(v=>v.id==='ackit.graph')) throw new Error('ackit.graph view missing');
          console.log('manifest contract PASS');
          "
      - name: Extension typecheck
        run: pnpm --filter ackit-vscode run typecheck
      - name: Extension lint (vscode src)
        run: pnpm --filter ackit-vscode run lint
      - name: Extension build
        run: |
          pnpm --filter ackit-vscode run build
          test -f extensions/vscode/dist/extension.js
      - name: Extension unit tests
        run: pnpm --filter ackit-vscode run test:unit
      - name: VS Code Electron integration (xvfb)
        run: xvfb-run -a pnpm --filter ackit-vscode test
      - name: Version parity
        run: node scripts/check-version-parity.mjs
      - name: vsce ls
        run: |
          cd extensions/vscode
          npx --yes @vscode/vsce@4.1.1 ls --no-dependencies --no-yarn
      - name: vsce package --no-dependencies
        run: |
          pkgver=$(node -p "require('./extensions/vscode/package.json').version")
          vsix="ackit-vscode-${pkgver}.vsix"
          cd extensions/vscode
          npx --yes @vscode/vsce@4.1.1 package --no-dependencies --no-yarn --out "${vsix}"
          echo "VSIX_PATH=$(pwd)/${vsix}" >> "${GITHUB_ENV}"
      - name: VSIX content audit and packaged parity
        run: node scripts/check-vsix.mjs "${VSIX_PATH}"
      - name: Offline-egress extension audit
        run: node scripts/check-offline-egress.mjs
