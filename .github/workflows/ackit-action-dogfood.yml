name: ACKit Action Dogfood

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  action-smoke:
    name: action smoke (uses ./)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 (f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a)
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Run ACKit via local action (scan)
        id: ackit
        uses: ./
        with:
          command: scan
          args: "--json"
          fail-threshold: medium
          upload-sarif: "true"
      - name: Verify findings JSON exists
        env:
          FINDINGS: ${{ steps.ackit.outputs.findings-json }}
          SARIF: ${{ steps.ackit.outputs.sarif-path }}
        run: |
          test -f "${FINDINGS}"
          test -f "${SARIF}"
      - name: Clean external Action consumer
        run: pnpm run smoke:action
