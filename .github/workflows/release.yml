name: Release

# Controlled automated release — the user-authorized tag boundary.
#
# A normal master push NEVER publishes; only CI (.github/workflows/ci.yml)
# runs. The deliberate human/maintainer action is creating and pushing an
# annotated vX.Y.Z tag AFTER explicit user authorization recorded in the
# active task. This workflow then publishes ALL release surfaces in one
# deterministic chain, with a FAIL-CLOSED MANUAL Marketplace gate BEFORE
# npm publish (TASK-0094; ADR-0033 amended, ADR-0023 manual path restored):
#   1. checks out the exact tagged commit,
#   2. validates tag <-> package.json <-> extensions/vscode/package.json
#      <-> package-name identity (+ npm CLI capability),
#   3. runs the full quality gate (install/lint/format/typecheck/build/tests/
#      schema-drift/real-tarball consumer smoke),
#   4. builds the exact VSIX from the tagged source and records its SHA-256,
#   5. runs the deterministic VSIX preflight (root == extension == tag;
#      VSIX manifest == release; packaged README == release; packaged
#      CHANGELOG latest == release; publisher == Cynrath; no node_modules;
#      size limit; no secrets; offline-egress gate) BEFORE any publish,
#   6. confirms the exact version is absent from the npm registry,
#   7. MANUAL MARKETPLACE GATE (fail-closed, BEFORE npm publish): verifies
#      `vsce show Cynrath.ackit-vscode --json` already reports the release
#      version (user-published OUTSIDE this workflow with their own
#      credential: `vsce publish --packagePath <exact-vsix>`; NO OIDC flag
#      in automation — unpublished in @vscode/vsce 4.0.0; NO VSCE_PAT,
#      NO stored credentials, NO long-lived credential in the repo). If
#      Marketplace is not
#      yet at the release version, the run FAILS HERE with instructions
#      and npm is NEVER published (no partial release possible).
#      Re-run the failed workflow AFTER the manual publish; the
#      duplicate-safe flow then proceeds (verification must still pass),
#   8. publishes to npm via OIDC Trusted Publishing (short-lived credentials;
#      NO long-lived npm token lives in GitHub Secrets),
#   9. verifies registry metadata/shasum/dist-tag with bounded retries plus a
#      fresh isolated consumer (mktemp + unique npm_config_cache, no global mutation)
#      and a secondary npx smoke,
#   10. re-verifies Marketplace live state read-only (latest ==
#      RELEASE_VERSION; NO publish attempt here — the gate in step 7 is the
#      only Marketplace check; NO second publish after visibility),
#   11. and ONLY THEN creates the immutable GitHub Release with the exact
#      audited VSIX attached, verifies the attached asset SHA-256 equals
#      the audited SHA-256, and runs final public-surface
#      verification (npm latest + Marketplace latest + Release + VSIX).
#
# If the manual Marketplace gate fails, do NOT push npm: publish the exact
# audited VSIX manually (`vsce publish --packagePath <VSIX_PATH>` with the
# maintainer's own credential, outside this workflow), then RE-RUN the failed
# workflow run — the gate then passes and npm publishes. Never move/delete
# the tag; a rerun after a successful npm publish fails safely at the
# version-absence gate and only manual downstream repair applies.
#
# Historical note (v0.5.3, run 35727290676): the workflow attempted an
# automated Marketplace publish using an OIDC flag plus a camelCase
# duplicate option (both literals recorded in TASK-0092/TASK-0094 evidence;
# the run failed closed on an unknown-option error for the duplicate flag,
# and deeper the OIDC flag is unpublished in @vscode/vsce 4.0.0).
# npm 0.5.3 had already published → partial release.
# The manual gate above makes that ordering impossible: Marketplace must be
# live BEFORE npm publishes.
#
# Manual Marketplace prerequisite (outside this workflow, user-performed):
# the maintainer publishes the exact audited VSIX built from the tagged
# source (`vsce publish --packagePath ackit-vscode-<VERSION>.vsix`) with
# their own credential BEFORE pushing the tag (or before re-running this
# workflow after a gate failure). No PAT or long-lived credential lives in
# the repo and this workflow references no credential from GitHub Secrets.
# (See ADR-0033 amendment: upstream OIDC unpublished, ADR-0023 manual path
# restored.)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: validated publish (manual Marketplace gate + npm) + verify + GitHub Release + VSIX
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 (f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a)
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      # actions/setup-node@v4 (ae0d4ed08881f17d1511386f5be3e62356acd4a6)
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # pnpm/action-setup@v4 (b906affcce14559ad1aafd4ab0e942779e9f58b1)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json

      - name: Validate tag shape, checkout identity, package identity, npm CLI capability
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG_NAME}' is not an exact vX.Y.Z release tag"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${TAG_NAME}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::checked-out commit ${HEAD_COMMIT} is not the tagged commit ${TAG_COMMIT}"
            exit 2
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${TAG_NAME#v}" ]; then
            echo "::error::package.json version '${PKG_VERSION}' does not match tag '${TAG_NAME}'"
            exit 3
          fi
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "${PKG_NAME}" != "@cynrath/agent-context-kit" ]; then
            echo "::error::unexpected package name '${PKG_NAME}'"
            exit 4
          fi
          EXT_VERSION="$(node -p "require('./extensions/vscode/package.json').version")"
          if [ "${EXT_VERSION}" != "${TAG_NAME#v}" ]; then
            echo "::error::extensions/vscode/package.json version '${EXT_VERSION}' does not match tag '${TAG_NAME}' (ADR-0023 coupling)"
            exit 5
          fi
          EXT_PUBLISHER="$(node -p "require('./extensions/vscode/package.json').publisher")"
          if [ "${EXT_PUBLISHER}" != "Cynrath" ]; then
            echo "::error::extension publisher '${EXT_PUBLISHER}' != 'Cynrath'"
            exit 6
          fi
          NPM_VERSION="$(npm --version)"
          SMALLEST="$(printf '%s\n' '11.5.1' "${NPM_VERSION}" | sort -V | head -n1)"
          if [ "${SMALLEST}" != '11.5.1' ]; then
            echo "::error::npm ${NPM_VERSION} lacks Trusted Publishing support (requires >= 11.5.1)"
            exit 7
          fi
          {
            echo "RELEASE_TAG=${TAG_NAME}"
            echo "RELEASE_VERSION=${PKG_VERSION}"
          } >> "${GITHUB_ENV}"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Lint, format check, typecheck
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck

      - name: Build and regenerate schemas (drift gate)
        run: |
          pnpm build
          pnpm gen:schemas
          git diff --exit-code -- schemas

      - name: Tests
        run: pnpm test

      - name: Build exact VSIX from tagged source
        run: |
          set -euo pipefail
          if [ "${EXT_VERSION:-}" != "" ]; then
            echo "extension version already validated: ${EXT_VERSION}"
          fi
          ROOT_VER="$(node -p "require('./package.json').version")"
          EXT_VER="$(node -p "require('./extensions/vscode/package.json').version")"
          if [ "${ROOT_VER}" != "${RELEASE_VERSION}" ]; then
            echo "::error::root version '${ROOT_VER}' != release version '${RELEASE_VERSION}'"
            exit 50
          fi
          if [ "${EXT_VER}" != "${RELEASE_VERSION}" ]; then
            echo "::error::extension version '${EXT_VER}' != release version '${RELEASE_VERSION}' (ADR-0023 coupling)"
            exit 51
          fi
          EXT_PUB="$(node -p "require('./extensions/vscode/package.json').publisher")"
          if [ "${EXT_PUB}" != "Cynrath" ]; then
            echo "::error::extension publisher '${EXT_PUB}' != 'Cynrath'"
            exit 52
          fi
          pnpm --filter ackit-vscode exec esbuild src/extension.ts --bundle --platform=node --target=node20 --outfile=dist/extension.js --external:vscode --sourcemap
          test -f extensions/vscode/dist/extension.js
          cd extensions/vscode
          npx --yes @vscode/vsce package --no-dependencies --no-yarn --out "ackit-vscode-${RELEASE_VERSION}.vsix"
          test -f "ackit-vscode-${RELEASE_VERSION}.vsix"
          VSIX_ABS="$(pwd)/ackit-vscode-${RELEASE_VERSION}.vsix"
          VSIX_SHA256="$(sha256sum "${VSIX_ABS}" | cut -d' ' -f1)"
          {
            echo "VSIX_PATH=${VSIX_ABS}"
            echo "VSIX_FILENAME=ackit-vscode-${RELEASE_VERSION}.vsix"
            echo "VSIX_SHA256=${VSIX_SHA256}"
          } >> "${GITHUB_ENV}"
          ls -lh "${VSIX_ABS}"
          echo "exact VSIX built: ackit-vscode-${RELEASE_VERSION}.vsix SHA-256 ${VSIX_SHA256}"

      - name: VSIX preflight — parity, security, offline audit (fail-closed, before any publish)
        run: |
          set -euo pipefail
          echo "VSIX_PATH=${VSIX_PATH}"
          echo "RELEASE_VERSION=${RELEASE_VERSION} RELEASE_TAG=${RELEASE_TAG}"
          test -f "${VSIX_PATH}"
          ROOT_VER="$(node -p "require('./package.json').version")"
          EXT_VER="$(node -p "require('./extensions/vscode/package.json').version")"
          if [ "${ROOT_VER}" != "${RELEASE_VERSION}" ]; then
            echo "::error::root version '${ROOT_VER}' != release version '${RELEASE_VERSION}'"
            exit 53
          fi
          if [ "${EXT_VER}" != "${RELEASE_VERSION}" ]; then
            echo "::error::extension version '${EXT_VER}' != release version '${RELEASE_VERSION}'"
            exit 54
          fi
          if [ "v${RELEASE_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::tag '${RELEASE_TAG}' != 'v${RELEASE_VERSION}'"
            exit 55
          fi
          MAN_VER="$(unzip -p "${VSIX_PATH}" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "${MAN_VER}" != "${RELEASE_VERSION}" ]; then
            echo "::error::VSIX manifest version '${MAN_VER}' != release version '${RELEASE_VERSION}'"
            exit 56
          fi
          MAN_PUB="$(unzip -p "${VSIX_PATH}" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).publisher")"
          if [ "${MAN_PUB}" != "Cynrath" ]; then
            echo "::error::VSIX publisher '${MAN_PUB}' != 'Cynrath'"
            exit 57
          fi
          unzip -p "${VSIX_PATH}" extension/readme.md > /tmp/vsix-readme.md
          if ! grep -q "\*\*Version:\*\* \`${RELEASE_VERSION}\`" /tmp/vsix-readme.md; then
            echo "::error::packaged README Version != ${RELEASE_VERSION}"
            exit 58
          fi
          if ! grep -q "ackit.status.v1" /tmp/vsix-readme.md; then
            echo "::error::packaged README missing ackit.status.v1 marker"
            exit 59
          fi
          unzip -p "${VSIX_PATH}" extension/changelog.md > /tmp/vsix-changelog.md
          CHANGELOG_LATEST="$(grep -m1 -o '^## \[[^]]*\]' /tmp/vsix-changelog.md || true)"
          echo "packaged CHANGELOG latest: ${CHANGELOG_LATEST}"
          if ! echo "${CHANGELOG_LATEST}" | grep -q "## \[${RELEASE_VERSION}\]"; then
            echo "::error::packaged CHANGELOG latest '${CHANGELOG_LATEST}' != '## [${RELEASE_VERSION}]'"
            exit 60
          fi
          if unzip -l "${VSIX_PATH}" | grep -q "node_modules"; then
            echo "::error::VSIX contains node_modules"
            exit 61
          fi
          cd extensions/vscode
          npx --yes @vscode/vsce ls --no-dependencies --no-yarn > /tmp/vsce-ls.txt
          cat /tmp/vsce-ls.txt
          if grep -q "node_modules" /tmp/vsce-ls.txt; then
            echo "::error::vsce ls lists node_modules"
            exit 62
          fi
          cd ../..
          VSIX_SIZE="$(stat -c%s "${VSIX_PATH}")"
          echo "VSIX size ${VSIX_SIZE} bytes"
          if [ "${VSIX_SIZE}" -gt 2097152 ]; then
            echo "::error::VSIX size ${VSIX_SIZE} exceeds 2MB limit"
            exit 63
          fi
          if unzip -p "${VSIX_PATH}" extension/package.json | grep -q "AKIA"; then
            echo "::error::secret pattern in VSIX manifest"
            exit 64
          fi
          node scripts/check-offline-egress.mjs
          if grep -R "fetch.*http" extensions/vscode/src; then
            echo "::error::extension source contains remote fetch"
            exit 65
          fi
          CURRENT_SHA="$(sha256sum "${VSIX_PATH}" | cut -d' ' -f1)"
          if [ "${CURRENT_SHA}" != "${VSIX_SHA256}" ]; then
            echo "::error::VSIX SHA changed during preflight ${VSIX_SHA256} != ${CURRENT_SHA}"
            exit 66
          fi
          echo "VSIX preflight PASS ackit-vscode-${RELEASE_VERSION}.vsix SHA-256 ${VSIX_SHA256}"

      - name: Pack tarball and record shasum
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-pack
          pnpm pack --pack-destination /tmp/release-pack >/dev/null
          TARBALL_PATH="$(ls -t /tmp/release-pack/*.tgz | head -n1)"
          echo "TARBALL_PATH=${TARBALL_PATH}" >> "${GITHUB_ENV}"
          echo "TARBALL_SHASUM=$(sha1sum "${TARBALL_PATH}" | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Real-tarball isolated consumer smoke
        run: pnpm run smoke:package

      - name: Confirm exact version is absent from the npm registry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            view_err="$(mktemp)"
            if npm view "@cynrath/agent-context-kit@${RELEASE_VERSION}" version > /dev/null 2> "${view_err}"; then
              echo "::error::version ${RELEASE_VERSION} already exists on npm; refusing to overwrite"
              exit 10
            fi
            if grep -q "E404" "${view_err}"; then
              echo "registry reports 404 for ${RELEASE_VERSION}; safe to publish"
              exit 0
            fi
            echo "attempt ${attempt}: non-404 registry error; retrying after 5s"
            cat "${view_err}"
            sleep 5
          done
          echo "::error::could not confirm version absence on npm"
          exit 11

      - name: Manual Marketplace publish gate (fail-closed, BEFORE npm publish)
        run: |
          set -euo pipefail
          # No automated `vsce publish` exists here by design (TASK-0094):
          # `--oidc` is unpublished in @vscode/vsce 4.0.0 and any automated
          # publish would risk another npm-ahead-of-Marketplace partial.
          # The maintainer publishes the exact audited VSIX manually OUTSIDE
          # this workflow; this gate only READS live state and fails closed
          # before npm publish when Marketplace is not yet at the target.
          if [ -n "${VSCE_PAT:-}" ]; then
            echo "::error::VSCE_PAT must not be set (manual publish uses the maintainer's own credential outside this workflow)"
            exit 60
          fi
          seen=0
          for attempt in 1 2 3; do
            if npx --yes @vscode/vsce show Cynrath.ackit-vscode --json > /tmp/mkt-pre.json 2> /tmp/mkt-pre.err; then
              PRE_VER="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/mkt-pre.json','utf8')).versions?.[0]?.version ?? 'unknown'")"
              echo "Marketplace live latest: ${PRE_VER} (release target ${RELEASE_VERSION})"
              if [ "${PRE_VER}" = "${RELEASE_VERSION}" ]; then
                echo "Manual Marketplace gate PASS — ${RELEASE_VERSION} already live; npm publish may proceed"
                seen=1
              else
                echo "::error::Marketplace live is '${PRE_VER}', not '${RELEASE_VERSION}'. Publish the exact audited VSIX manually (vsce publish --packagePath ${VSIX_PATH}) with your own credential, then RE-RUN this failed workflow. npm publish is BLOCKED until this gate passes."
                exit 61
              fi
              exit 0
            fi
            echo "marketplace gate probe attempt ${attempt}/3 failed; retrying after 5s"
            cat /tmp/mkt-pre.err || true
            sleep 5
          done
          echo "::error::Marketplace live state unreadable after 3 attempts; failing closed before npm publish"
          exit 62

      - name: Publish to npm via OIDC Trusted Publishing
        run: npm publish "${TARBALL_PATH}" --access public --provenance

      - name: Verify registry metadata, shasum, and dist-tag (bounded propagation retry)
        run: |
          set -euo pipefail
          seen=0
          for attempt in $(seq 1 30); do
            if npm view "@cynrath/agent-context-kit@${RELEASE_VERSION}" version > /dev/null 2>&1; then
              seen=1
              break
            fi
            echo "attempt ${attempt}/30: published version not visible yet; waiting 10s"
            sleep 10
          done
          if [ "${seen}" -ne 1 ]; then
            echo "::error::published version never became visible on the registry"
            exit 20
          fi
          REG_SHASUM="$(npm view "@cynrath/agent-context-kit@${RELEASE_VERSION}" dist.shasum --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))")"
          if [ "${REG_SHASUM}" != "${TARBALL_SHASUM}" ]; then
            echo "::error::registry shasum ${REG_SHASUM} != local tarball shasum ${TARBALL_SHASUM}"
            exit 21
          fi
          LATEST="$(npm view @cynrath/agent-context-kit dist-tags.latest)"
          if [ "${LATEST}" != "${RELEASE_VERSION}" ]; then
            echo "::error::dist-tag latest='${LATEST}' does not point at ${RELEASE_VERSION}"
            exit 22
          fi

      - name: Fresh isolated registry consumer (cache-immune, no global mutation)
        run: |
          set -euo pipefail
          CONSUMER_TMP="$(mktemp -d)"
          CACHE_TMP="$(mktemp -d)"
          export npm_config_cache="${CACHE_TMP}"
          trap 'rm -rf "${CONSUMER_TMP}" "${CACHE_TMP}"' EXIT
          echo "consumer=${CONSUMER_TMP} cache=${CACHE_TMP}"
          for attempt in $(seq 1 6); do
            if npm install --prefix "${CONSUMER_TMP}" "@cynrath/agent-context-kit@${RELEASE_VERSION}" --no-package-lock --no-save > /dev/null 2>&1; then
              break
            fi
            echo "fresh install attempt ${attempt}/6 failed; retrying after 10s"
            sleep 10
            if [ "${attempt}" -eq 6 ]; then
              echo "::error::fresh consumer install failed"
              exit 30
            fi
          done
          INSTALLED_VER="$("${CONSUMER_TMP}/node_modules/.bin/ackit" --version)"
          if [ "${INSTALLED_VER}" != "${RELEASE_VERSION}" ]; then
            echo "::error::fresh consumer version mismatch installed='${INSTALLED_VER}' expected='${RELEASE_VERSION}'"
            exit 31
          fi
          "${CONSUMER_TMP}/node_modules/.bin/ackit" --help > /tmp/fresh-help.txt
          if grep -q "REQ-\|ADR-\|VNEXT\|GOAL2\|rebuild/ackit-vnext" /tmp/fresh-help.txt; then
            echo "::error::fresh consumer --help contains internal identifiers"
            exit 32
          fi
          echo "fresh isolated consumer PASS -- version ${INSTALLED_VER}"

      - name: Secondary npx consumer smoke (best-effort, after fresh isolated success)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if npx --yes "@cynrath/agent-context-kit@${RELEASE_VERSION}" --version | grep -qx "${RELEASE_VERSION}"; then
              echo "npx consumer smoke passed"
              exit 0
            fi
            echo "npx attempt ${attempt}/6 failed; retrying after 10s"
            sleep 10
          done
          echo "::warning::npx smoke failed but fresh isolated consumer already passed; continuing"
          # do not fail the release — fresh consumer is the hard gate; npx cache may be stale

      - name: Verify Marketplace still live after npm (read-only, no publish)
        run: |
          set -euo pipefail
          seen=0
          for attempt in $(seq 1 30); do
            if npx --yes @vscode/vsce show Cynrath.ackit-vscode --json > /tmp/mkt-show.json 2> /tmp/mkt-show.err; then
              MKT_VER="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/mkt-show.json','utf8')).versions?.[0]?.version ?? ''")"
              if [ "${MKT_VER}" = "${RELEASE_VERSION}" ]; then
                seen=1
                echo "Marketplace reports ${MKT_VER} (attempt ${attempt}/30)"
                break
              fi
              echo "attempt ${attempt}/30: Marketplace latest '${MKT_VER}' != '${RELEASE_VERSION}'; waiting 20s"
            else
              echo "attempt ${attempt}/30: vsce show failed; waiting 20s"
              cat /tmp/mkt-show.err || true
            fi
            sleep 20
          done
          if [ "${seen}" -ne 1 ]; then
            echo "::error::Marketplace version ${RELEASE_VERSION} never became visible for Cynrath.ackit-vscode"
            exit 70
          fi
          node -e "
            const m = JSON.parse(require('fs').readFileSync('/tmp/mkt-show.json','utf8'));
            const pub = m.publisher?.publisherName ?? m.publisherName ?? '';
            const ext = m.extensionName ?? '';
            const ver = m.versions?.[0]?.version ?? '';
            if (pub && pub !== 'Cynrath') { console.error('::error::Marketplace publisher mismatch: ' + pub); process.exit(71); }
            if (ext && ext !== 'ackit-vscode') { console.error('::error::Marketplace extension mismatch: ' + ext); process.exit(72); }
            if (ver !== process.env.RELEASE_VERSION) { console.error('::error::Marketplace version mismatch: ' + ver); process.exit(73); }
            console.log('Marketplace identity verified - Cynrath.ackit-vscode ' + ver);
          "
          echo "Marketplace live verification PASS — no further publish attempted"

      - name: Create GitHub Release and attach audited VSIX (strictly after npm + Marketplace verification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Extract exact version section from CHANGELOG.md deterministically
          RELEASE_NOTES_TMP="$(mktemp)"
          # Use Node script to extract section for $RELEASE_VERSION (fails if absent/empty)
          node scripts/extract-changelog-section.mjs "${RELEASE_VERSION}" CHANGELOG.md "${RELEASE_NOTES_TMP}.section"
          if [ ! -s "${RELEASE_NOTES_TMP}.section" ]; then
            echo "::error::CHANGELOG section for ${RELEASE_VERSION} is missing or empty"
            exit 40
          fi
          test -f "${VSIX_PATH}"
          CURRENT_SHA="$(sha256sum "${VSIX_PATH}" | cut -d' ' -f1)"
          if [ "${CURRENT_SHA}" != "${VSIX_SHA256}" ]; then
            echo "::error::VSIX SHA changed before Release ${VSIX_SHA256} != ${CURRENT_SHA}"
            exit 41
          fi
          # Prepend header/install block
          {
            echo "# AgentContextKit v${RELEASE_VERSION}"
            echo ""
            echo "AgentContextKit v${RELEASE_VERSION} release. See highlights and detailed notes below."
            echo ""
            echo "## Install / upgrade"
            echo ""
            echo '```bash'
            echo "npm install --global @cynrath/agent-context-kit@${RELEASE_VERSION}"
            echo "npx --yes @cynrath/agent-context-kit@${RELEASE_VERSION} --version"
            echo '```'
            echo ""
            echo "## VS Code extension"
            echo ""
            echo '```bash'
            echo "code --install-extension ackit-vscode-${RELEASE_VERSION}.vsix"
            echo '```'
            echo ""
            echo "Marketplace: Cynrath.ackit-vscode@${RELEASE_VERSION}"
            echo "VSIX: ackit-vscode-${RELEASE_VERSION}.vsix (SHA-256 ${VSIX_SHA256})"
            echo ""
            cat "${RELEASE_NOTES_TMP}.section"
            echo ""
            echo "## Distribution"
            echo "- npm: @cynrath/agent-context-kit@${RELEASE_VERSION}"
            echo "- VS Code Marketplace: Cynrath.ackit-vscode@${RELEASE_VERSION}"
            echo "- VSIX: ackit-vscode-${RELEASE_VERSION}.vsix (SHA-256 ${VSIX_SHA256})"
            echo "- Node >= 22"
            echo "- npm/npx distribution via OIDC Trusted Publishing + provenance"
            echo "- VSIX/Marketplace distribution via manual maintainer publish of the exact audited VSIX (fail-closed gate before npm; no PAT in repo)"
            echo "- legacy .NET/NuGet line unchanged"
          } > "${RELEASE_NOTES_TMP}"
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "AgentContextKit ${RELEASE_TAG}" \
            --notes-file "${RELEASE_NOTES_TMP}" \
            "${VSIX_PATH}"
          ASSET_TMP="$(mktemp -d)"
          trap 'rm -rf "${ASSET_TMP}"' EXIT
          gh release download "${RELEASE_TAG}" --pattern "${VSIX_FILENAME}" --dir "${ASSET_TMP}"
          DOWN_SHA="$(sha256sum "${ASSET_TMP}/${VSIX_FILENAME}" | cut -d' ' -f1)"
          if [ "${DOWN_SHA}" != "${VSIX_SHA256}" ]; then
            echo "::error::Release asset SHA ${DOWN_SHA} != audited VSIX SHA ${VSIX_SHA256}"
            exit 80
          fi
          echo "GitHub Release asset PASS ${VSIX_FILENAME} SHA-256 ${DOWN_SHA}"

      - name: Final public-surface verification (npm + Marketplace + Release + VSIX)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NPM_LATEST="$(npm view @cynrath/agent-context-kit dist-tags.latest)"
          if [ "${NPM_LATEST}" != "${RELEASE_VERSION}" ]; then
            echo "::error::npm latest='${NPM_LATEST}' != '${RELEASE_VERSION}'"
            exit 90
          fi
          npx --yes @vscode/vsce show Cynrath.ackit-vscode --json > /tmp/mkt-final.json
          MKT_FINAL="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/mkt-final.json','utf8')).versions?.[0]?.version ?? ''")"
          if [ "${MKT_FINAL}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Marketplace latest='${MKT_FINAL}' != '${RELEASE_VERSION}'"
            exit 91
          fi
          VIEW_TAG="$(gh release view "${RELEASE_TAG}" --json tagName --jq '.tagName')"
          if [ "${VIEW_TAG}" != "${RELEASE_TAG}" ]; then
            echo "::error::GitHub Release tag '${VIEW_TAG}' != '${RELEASE_TAG}'"
            exit 92
          fi
          if ! gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -qx "${VSIX_FILENAME}"; then
            echo "::error::GitHub Release missing VSIX asset ${VSIX_FILENAME}"
            exit 93
          fi
          echo "final public-surface verification PASS npm=${NPM_LATEST} marketplace=${MKT_FINAL} release=${RELEASE_TAG} vsix=${VSIX_FILENAME} sha=${VSIX_SHA256}"
