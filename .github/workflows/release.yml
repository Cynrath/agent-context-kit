name: release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish, recover an exact existing package, or verify an immutable release
        required: true
        default: verify-existing
        type: choice
        options:
          - publish
          - recover-existing
          - verify-existing
      version:
        description: SemVer package version without v prefix
        required: true
        type: string
      automation_commit_sha:
        description: Exact origin/master commit containing the release automation
        required: true
        type: string
      release_commit_sha:
        description: Exact commit represented by the package, tag, and GitHub Release
        required: true
        type: string
      prerelease:
        description: Require or create a GitHub pre-release
        required: true
        default: true
        type: boolean
      source_run_id:
        description: Prior release run containing the exact validated recovery artifact
        required: false
        type: string
      source_artifact_digest:
        description: Exact sha256 digest reported by GitHub for the prior workflow artifact
        required: false
        type: string
      expected_nupkg_sha256:
        description: Exact SHA-256 of the validated unsigned nupkg recovery asset
        required: false
        type: string
      expected_snupkg_sha256:
        description: Exact SHA-256 of the validated snupkg recovery asset
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ inputs.operation }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-publish:
    if: inputs.operation == 'publish'
    name: validate exact package
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Checkout exact automation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.automation_commit_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate commit and version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ("${{ inputs.automation_commit_sha }}" -ne "${{ inputs.release_commit_sha }}") {
            throw "Publish requires automation_commit_sha and release_commit_sha to be identical."
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-release.ps1 -Version "${{ inputs.version }}" -CommitSha "${{ inputs.release_commit_sha }}" -RequireOriginMaster -FailOnIssues

      - name: Restore, build, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore AgentContextKit.sln --nologo
          dotnet build AgentContextKit.sln -c Release --no-restore --nologo
          dotnet test AgentContextKit.sln -c Release --no-build --nologo

      - name: Validate source outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project src/AgentContextKit.Cli -c Release --no-build -- scan --ci
          dotnet run --project src/AgentContextKit.Cli -c Release --no-build -- doctor
          $jsonPath = Join-Path $env:RUNNER_TEMP "ackit-scan.json"
          dotnet run --project src/AgentContextKit.Cli -c Release --no-build -- scan --json | Set-Content -LiteralPath $jsonPath -Encoding utf8
          Get-Content $jsonPath -Raw | ConvertFrom-Json | Out-Null
          dotnet run --project src/AgentContextKit.Cli -c Release --no-build -- sarif --output .ackit/reports/release.sarif
          Get-Content .ackit/reports/release.sarif -Raw | ConvertFrom-Json | Out-Null

      - name: Run release gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-samples.ps1 -NoBuild
          pwsh -NoProfile -File scripts/test-local-markdown-links.ps1
          pwsh -NoProfile -File scripts/check-local-markdown-links.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-config-generated-conventions.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-v020-readiness.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-v100-readiness.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-v100-documentation-release-gates.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-rc-local-readiness.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-security-supply-chain-evidence.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-published-supply-chain-status.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-public-release-gates.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-supply-chain-workflow.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-release-workflow.ps1 -FailOnIssues
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-release-recovery.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1 -Version "${{ inputs.version }}"

      - name: Pack and inspect candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $packageRoot = Join-Path $env:RUNNER_TEMP "ackit-release-package"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-package-metadata.ps1 -ExpectedVersion "${{ inputs.version }}" -FailOnIssues
          dotnet pack src/AgentContextKit.Cli/AgentContextKit.Cli.csproj -c Release --no-build -o $packageRoot
          $nupkg = Get-Item (Join-Path $packageRoot "AgentContextKit.${{ inputs.version }}.nupkg")
          $snupkg = Get-Item (Join-Path $packageRoot "AgentContextKit.${{ inputs.version }}.snupkg")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entries = $archive.Entries.FullName
            foreach ($required in @("AgentContextKit.nuspec", "tools/net10.0/any/AgentContextKit.Cli.dll", "README.nuget.md")) {
              if ($entries -notcontains $required) { throw "Package entry missing: $required" }
            }
          }
          finally {
            $archive.Dispose()
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-published-package.ps1 -Version "${{ inputs.version }}" -PackageSource $packageRoot

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: AgentContextKit-${{ inputs.version }}
          path: ${{ runner.temp }}/ackit-release-package/*.*nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.operation == 'publish'
    name: publish and create release
    needs: validate-publish
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_commit_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: AgentContextKit-${{ inputs.version }}
          path: ${{ runner.temp }}/ackit-release-package

      - name: Inspect remote release state
        id: state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ inputs.version }}"
          $commit = "${{ inputs.release_commit_sha }}"
          $tagName = "v$version"
          pwsh -NoProfile -File scripts/prepare-release.ps1 -Version $version -CommitSha $commit -RequireOriginMaster -FailOnIssues

          $packageUrl = "https://api.nuget.org/v3-flatcontainer/agentcontextkit/$version/agentcontextkit.$version.nupkg"
          try { Invoke-WebRequest -Uri $packageUrl -Method Head -UseBasicParsing | Out-Null; $packageExists = $true } catch { $packageExists = $false }

          git fetch --tags origin
          $tagExists = @(git tag --list $tagName) -contains $tagName
          if ($tagExists) {
            $tagCommit = (git rev-list -n 1 $tagName).Trim()
            if ($tagCommit -ne $commit) { throw "Existing tag targets a different commit." }
          }

          $releaseTags = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName')
          $releaseExists = $releaseTags -contains $tagName
          "package_exists=$($packageExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Login to NuGet with trusted publishing
        if: steps.state.outputs.package_exists != 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: Cyranth

      - name: Publish NuGet package
        if: steps.state.outputs.package_exists != 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Get-Item (Join-Path "${{ runner.temp }}/ackit-release-package" "AgentContextKit.${{ inputs.version }}.nupkg")
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate

      - name: Verify published package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-published-package.ps1 -Version "${{ inputs.version }}"

      - name: Create exact tag when missing
        if: steps.state.outputs.tag_exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagName = "v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tagName" "${{ inputs.release_commit_sha }}"
          git push origin "$tagName"

      - name: Create or complete GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ inputs.version }}"
          $tagName = "v$version"
          if ($version -eq "1.0.0-rc.1") {
            $notesFile = "docs/RELEASE_BODY_V100_RC1.md"
          }
          else {
            $notesTag = $version -replace '\.', '_' -replace '-', '_'
            $notesFile = "docs/RELEASE_BODY_V020_$($notesTag.ToUpperInvariant()).md"
          }
          if (-not (Test-Path $notesFile -PathType Leaf)) {
            throw "Release body file not found: $notesFile. Create a version-specific body file at this path before release."
          }
          $packageRoot = "${{ runner.temp }}/ackit-release-package"
          $assets = @(Get-ChildItem $packageRoot -Filter "AgentContextKit.$version.*nupkg" | ForEach-Object FullName)
          if ("${{ steps.state.outputs.release_exists }}" -ne "true") {
            if ([System.Convert]::ToBoolean("${{ inputs.prerelease }}")) {
              gh release create $tagName @assets --repo "${{ github.repository }}" --verify-tag --target "${{ inputs.release_commit_sha }}" --title "AgentContextKit $version" --notes-file $notesFile --prerelease
            }
            else {
              gh release create $tagName @assets --repo "${{ github.repository }}" --verify-tag --target "${{ inputs.release_commit_sha }}" --title "AgentContextKit $version" --notes-file $notesFile
            }
          }
          else {
            $existingAssets = @(gh release view $tagName --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
            foreach ($asset in $assets) {
              if ($existingAssets -notcontains [System.IO.Path]::GetFileName($asset)) {
                gh release upload $tagName $asset --repo "${{ github.repository }}"
              }
            }
          }

      - name: Verify tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --tags origin
          $tagCommit = (git rev-list -n 1 "v${{ inputs.version }}").Trim()
          if ($tagCommit -ne "${{ inputs.release_commit_sha }}") { throw "Published tag does not target the exact release commit." }
          gh release view "v${{ inputs.version }}" --repo "${{ github.repository }}" --json tagName,isPrerelease,assets | ConvertFrom-Json | Out-Null

      - name: Inspect exact release asset provenance
        id: provenance-state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $subjectRoot = Join-Path "${{ runner.temp }}" "ackit-attestation-subject"
          Remove-Item $subjectRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $subjectRoot | Out-Null
          gh release download "v${{ inputs.version }}" --repo "${{ github.repository }}" --pattern "AgentContextKit.${{ inputs.version }}.nupkg" --dir $subjectRoot
          if ($LASTEXITCODE -ne 0) { throw "Unable to download the exact GitHub Release package asset." }
          $subject = Get-Item (Join-Path $subjectRoot "AgentContextKit.${{ inputs.version }}.nupkg")
          $digest = (Get-FileHash -Algorithm SHA256 $subject.FullName).Hash.ToLowerInvariant()
          $attestationOutput = gh api --include "repos/${{ github.repository }}/attestations/sha256:$digest" 2>&1
          $attestationExit = $LASTEXITCODE
          if ($attestationExit -eq 0) {
            $exists = $true
          }
          else {
            $attestationText = ($attestationOutput | Out-String)
            if ($attestationText -match "(?m)^HTTP/\S+\s+404\b" -or $attestationText -match "\(HTTP 404\)") {
              $exists = $false
            }
            else {
              throw "Unable to query release package attestation state. gh exit code: $attestationExit"
            }
          }
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest exact release package
        if: steps.provenance-state.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/ackit-attestation-subject/AgentContextKit.${{ inputs.version }}.nupkg

      - name: Verify exact release package attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $subject = Join-Path "${{ runner.temp }}/ackit-attestation-subject" "AgentContextKit.${{ inputs.version }}.nupkg"
          gh attestation verify $subject --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"

  recover-existing:
    if: inputs.operation == 'recover-existing'
    name: recover exact existing package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact recovery automation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.automation_commit_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run exact recovery safety gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File scripts/test-existing-package-recovery.ps1
          pwsh -NoProfile -File scripts/check-release-workflow.ps1 -FailOnIssues
          pwsh -NoProfile -File scripts/test-supply-chain-workflow.ps1

      - name: Validate exact source artifact and existing NuGet package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ inputs.version }}"
          $automationSha = "${{ inputs.automation_commit_sha }}"
          $releaseSha = "${{ inputs.release_commit_sha }}"
          $sourceRunId = "${{ inputs.source_run_id }}"
          $artifactDigest = "${{ inputs.source_artifact_digest }}".ToLowerInvariant()
          $expectedNupkgHash = "${{ inputs.expected_nupkg_sha256 }}".ToLowerInvariant()
          $expectedSnupkgHash = "${{ inputs.expected_snupkg_sha256 }}".ToLowerInvariant()
          $artifactName = "AgentContextKit-$version"
          $tagName = "v$version"

          if (-not [System.Convert]::ToBoolean("${{ inputs.prerelease }}")) { throw "Existing-package recovery requires prerelease=true." }
          if ($sourceRunId -notmatch '^\d+$') { throw "source_run_id must be a numeric GitHub Actions run ID." }
          if ($artifactDigest -notmatch '^sha256:[a-f0-9]{64}$') { throw "source_artifact_digest must be an exact sha256 digest." }
          if ($expectedNupkgHash -notmatch '^[a-f0-9]{64}$') { throw "expected_nupkg_sha256 must be an exact SHA-256 value." }
          if ($expectedSnupkgHash -notmatch '^[a-f0-9]{64}$') { throw "expected_snupkg_sha256 must be an exact SHA-256 value." }

          git fetch origin master --tags
          $headSha = (git rev-parse HEAD).Trim()
          $originMasterSha = (git rev-parse origin/master).Trim()
          if ($headSha -ne $automationSha) { throw "Checked-out HEAD does not match automation_commit_sha." }
          if ($originMasterSha -ne $automationSha) { throw "automation_commit_sha is not current origin/master." }
          $PSNativeCommandUseErrorActionPreference = $false
          git merge-base --is-ancestor $releaseSha $automationSha
          $isAncestor = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $isAncestor) { throw "release_commit_sha is not an ancestor of the recovery automation commit." }

          $sourceRun = gh run view $sourceRunId --repo "${{ github.repository }}" --json databaseId,workflowName,event,headSha,conclusion | ConvertFrom-Json
          if ($sourceRun.databaseId -ne [long]$sourceRunId) { throw "Source run identity mismatch." }
          if ($sourceRun.workflowName -ne 'release' -or $sourceRun.event -ne 'workflow_dispatch') { throw "Source run is not the expected manual release workflow." }
          if ($sourceRun.headSha -ne $releaseSha) { throw "Source run head SHA does not match release_commit_sha." }
          if ($sourceRun.conclusion -ne 'failure') { throw "Recovery source run must be the recorded partial-failure run." }

          $artifactResponse = gh api "repos/${{ github.repository }}/actions/runs/$sourceRunId/artifacts" | ConvertFrom-Json
          $artifacts = @($artifactResponse.artifacts | Where-Object { $_.name -eq $artifactName })
          if ($artifacts.Count -ne 1) { throw "Expected exactly one validated source artifact named $artifactName." }
          $artifact = $artifacts[0]
          if ([bool]$artifact.expired) { throw "Validated source artifact has expired." }
          if ($artifact.digest.ToLowerInvariant() -ne $artifactDigest) { throw "Validated source artifact digest mismatch." }
          if ($artifact.workflow_run.id -ne [long]$sourceRunId -or $artifact.workflow_run.head_sha -ne $releaseSha) { throw "Validated source artifact run/SHA mismatch." }

          $assetRoot = Join-Path $env:RUNNER_TEMP 'ackit-existing-package-recovery'
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null
          gh run download $sourceRunId --repo "${{ github.repository }}" --name $artifactName --dir $assetRoot
          $candidateNupkg = Join-Path $assetRoot "AgentContextKit.$version.nupkg"
          $candidateSnupkg = Join-Path $assetRoot "AgentContextKit.$version.snupkg"
          $sourceFiles = @(Get-ChildItem -LiteralPath $assetRoot -File)
          if ($sourceFiles.Count -ne 2 -or -not (Test-Path $candidateNupkg) -or -not (Test-Path $candidateSnupkg)) {
            throw "Validated source artifact must contain only the exact nupkg and snupkg files."
          }

          $nugetNupkg = Join-Path $env:RUNNER_TEMP "nuget-AgentContextKit.$version.nupkg"
          $packageUrl = "https://api.nuget.org/v3-flatcontainer/agentcontextkit/$version/agentcontextkit.$version.nupkg"
          Invoke-WebRequest -Uri $packageUrl -OutFile $nugetNupkg -UseBasicParsing
          $evidencePath = Join-Path $env:RUNNER_TEMP 'existing-package-recovery-evidence.json'
          pwsh -NoProfile -File scripts/verify-existing-package-recovery.ps1 `
            -Version $version `
            -ReleaseCommitSha $releaseSha `
            -CandidateNupkgPath $candidateNupkg `
            -CandidateSnupkgPath $candidateSnupkg `
            -NuGetNupkgPath $nugetNupkg `
            -ExpectedNupkgSha256 $expectedNupkgHash `
            -ExpectedSnupkgSha256 $expectedSnupkgHash `
            -OutputPath $evidencePath
          Get-Content $evidencePath -Raw | ConvertFrom-Json | Out-Null
          pwsh -NoProfile -File scripts/verify-published-package.ps1 -Version $version -PackageSource $assetRoot

          . ./scripts/github-release-state.ps1
          Assert-ExactExistingGitTag `
            -Tag $tagName `
            -ExpectedCommitSha $releaseSha `
            -UnprovenTagMessage "Recovery requires the exact existing tag before release creation." `
            -WrongTagMessage "Existing recovery tag does not target the exact release commit."
          Assert-GitHubReleaseAbsent `
            -Repository "${{ github.repository }}" `
            -Tag $tagName `
            -ExistingReleaseMessage "Recovery requires the GitHub Release and its assets to be absent before creation." `
            -UnprovenAbsenceMessage "Unable to prove that the GitHub Release and its assets are absent."
          foreach ($digest in @("sha256:$expectedNupkgHash", "sha256:$expectedSnupkgHash")) {
            Assert-GitHubAttestationAbsent `
              -Repository "${{ github.repository }}" `
              -Digest $digest `
              -ExistingAttestationMessage "Recovery requires both exact release asset attestations to be absent before creation." `
              -UnprovenAbsenceMessage "Unable to prove that an exact release asset attestation is absent."
          }

      - name: Recheck exact remote recovery state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagName = "v${{ inputs.version }}"
          $releaseSha = "${{ inputs.release_commit_sha }}"
          $expectedNupkgHash = "${{ inputs.expected_nupkg_sha256 }}".ToLowerInvariant()
          $expectedSnupkgHash = "${{ inputs.expected_snupkg_sha256 }}".ToLowerInvariant()
          . ./scripts/github-release-state.ps1
          Assert-ExactExistingGitTag `
            -Tag $tagName `
            -ExpectedCommitSha $releaseSha `
            -UnprovenTagMessage "Unable to re-prove the exact existing recovery tag." `
            -WrongTagMessage "Existing recovery tag changed target after validation; refusing release creation."
          Assert-GitHubReleaseAbsent `
            -Repository "${{ github.repository }}" `
            -Tag $tagName `
            -ExistingReleaseMessage "Recovery release or assets appeared after validation; refusing release creation." `
            -UnprovenAbsenceMessage "Unable to re-prove that the GitHub Release and its assets are absent."
          foreach ($digest in @("sha256:$expectedNupkgHash", "sha256:$expectedSnupkgHash")) {
            Assert-GitHubAttestationAbsent `
              -Repository "${{ github.repository }}" `
              -Digest $digest `
              -ExistingAttestationMessage "Recovery attestation appeared after validation; refusing release creation." `
              -UnprovenAbsenceMessage "Unable to re-prove that an exact release asset attestation is absent."
          }

      - name: Create GitHub prerelease from verified exact existing tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ inputs.version }}"
          $releaseSha = "${{ inputs.release_commit_sha }}"
          $tagName = "v$version"
          $notesFile = 'docs/RELEASE_BODY_V100_RC1.md'
          if ($version -ne '1.0.0-rc.1') { throw "This prepared recovery body is restricted to 1.0.0-rc.1." }
          if (-not (Test-Path $notesFile -PathType Leaf)) { throw "Prepared RC1 release body is missing." }
          $assetRoot = Join-Path $env:RUNNER_TEMP 'ackit-existing-package-recovery'
          $nupkg = Join-Path $assetRoot "AgentContextKit.$version.nupkg"
          $snupkg = Join-Path $assetRoot "AgentContextKit.$version.snupkg"
          gh release create $tagName `
            $nupkg `
            $snupkg `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --target $releaseSha `
            --title "AgentContextKit $version" `
            --notes-file $notesFile `
            --prerelease

      - name: Verify exact tag prerelease body and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ inputs.version }}"
          $releaseSha = "${{ inputs.release_commit_sha }}"
          $tagName = "v$version"
          $expectedNupkgHash = "${{ inputs.expected_nupkg_sha256 }}".ToLowerInvariant()
          $expectedSnupkgHash = "${{ inputs.expected_snupkg_sha256 }}".ToLowerInvariant()
          git fetch origin "refs/tags/$tagName:refs/tags/$tagName"
          if ((git rev-list -n 1 $tagName).Trim() -ne $releaseSha) { throw "Recovered tag does not target the exact release commit." }
          $release = gh release view $tagName --repo "${{ github.repository }}" --json tagName,targetCommitish,isPrerelease,title,body,assets,url | ConvertFrom-Json
          if ($release.tagName -ne $tagName -or $release.targetCommitish -ne $releaseSha) { throw "Recovered prerelease identity/target mismatch." }
          if (-not [bool]$release.isPrerelease) { throw "Recovered release is not a prerelease." }
          if ($release.title -ne "AgentContextKit $version") { throw "Recovered prerelease title mismatch." }
          $expectedBody = (Get-Content 'docs/RELEASE_BODY_V100_RC1.md' -Raw).Replace("`r`n", "`n").TrimEnd()
          $actualBody = ([string]$release.body).Replace("`r`n", "`n").TrimEnd()
          if ($actualBody -ne $expectedBody) { throw "Recovered prerelease body mismatch." }
          $expectedNames = @("AgentContextKit.$version.nupkg", "AgentContextKit.$version.snupkg")
          $actualNames = @($release.assets | ForEach-Object name | Sort-Object)
          if (($actualNames -join '|') -ne (($expectedNames | Sort-Object) -join '|')) { throw "Recovered prerelease asset set mismatch." }
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'ackit-recovered-release-assets'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          gh release download $tagName --repo "${{ github.repository }}" --dir $releaseRoot --pattern "AgentContextKit.$version.nupkg" --pattern "AgentContextKit.$version.snupkg"
          $nupkg = Join-Path $releaseRoot "AgentContextKit.$version.nupkg"
          $snupkg = Join-Path $releaseRoot "AgentContextKit.$version.snupkg"
          $actualNupkgHash = (Get-FileHash $nupkg -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSnupkgHash = (Get-FileHash $snupkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualNupkgHash -ne $expectedNupkgHash -or $actualSnupkgHash -ne $expectedSnupkgHash) { throw "Recovered release asset hash mismatch." }
          foreach ($asset in @($release.assets)) {
            $actualHash = if ($asset.name.EndsWith('.snupkg')) { $actualSnupkgHash } else { $actualNupkgHash }
            if ($asset.digest -ne "sha256:$actualHash") { throw "Recovered release asset API digest mismatch: $($asset.name)" }
          }

      - name: Attest exact recovered nupkg
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/ackit-recovered-release-assets/AgentContextKit.${{ inputs.version }}.nupkg

      - name: Attest exact recovered snupkg
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/ackit-recovered-release-assets/AgentContextKit.${{ inputs.version }}.snupkg

      - name: Verify both exact recovered asset attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'ackit-recovered-release-assets'
          $nupkg = Join-Path $root "AgentContextKit.${{ inputs.version }}.nupkg"
          $snupkg = Join-Path $root "AgentContextKit.${{ inputs.version }}.snupkg"
          gh attestation verify $nupkg --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          gh attestation verify $snupkg --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"

      - name: Verify completed immutable recovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $evidencePath = Join-Path $env:RUNNER_TEMP 'completed-recovery-evidence.json'
          pwsh -NoProfile -File scripts/verify-existing-release.ps1 `
            -Version "${{ inputs.version }}" `
            -AutomationCommitSha "${{ inputs.automation_commit_sha }}" `
            -ReleaseCommitSha "${{ inputs.release_commit_sha }}" `
            -Prerelease "${{ inputs.prerelease }}" `
            -Repository "${{ github.repository }}" `
            -OutputPath $evidencePath
          Get-Content $evidencePath -Raw | ConvertFrom-Json | Out-Null

  verify-recovered-package:
    if: inputs.operation == 'recover-existing'
    name: verify recovered package (${{ matrix.os }})
    needs: recover-existing
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout exact recovery automation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.automation_commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify recovered NuGet global tool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File scripts/verify-published-package.ps1 -Version "${{ inputs.version }}"

  verify-existing:
    if: inputs.operation == 'verify-existing'
    name: verify existing immutable release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact automation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.automation_commit_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify existing release without mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $evidencePath = Join-Path $env:RUNNER_TEMP "release-verification.json"
          pwsh -NoProfile -File scripts/verify-existing-release.ps1 `
            -Version "${{ inputs.version }}" `
            -AutomationCommitSha "${{ inputs.automation_commit_sha }}" `
            -ReleaseCommitSha "${{ inputs.release_commit_sha }}" `
            -Prerelease "${{ inputs.prerelease }}" `
            -Repository "${{ github.repository }}" `
            -OutputPath $evidencePath
          Get-Content $evidencePath -Raw | ConvertFrom-Json | Out-Null
