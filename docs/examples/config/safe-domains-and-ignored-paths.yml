# Safe domain and ignored paths starter config.
# Safe for most repositories that want to suppress non-Critical scanner noise
# from public package domains, badge infrastructure, and fixture/sample paths.
schemaVersion: 1
defaultLanguage: en
brandKeywords: []
piiKeywords: []
ignorePaths:
  - .ackit/cache/
  - .ackit/reports/
  - .ackit/webui/
  - .ackit/prompt-packs/
  - .ackit/context-exports/
riskExtensions:
  - .bak
  - .tmp
  - .log
  - .sql
safeDomains:
  - docs.example.invalid
  - "*.trusted.example.invalid"
ignoredPaths:
  - samples/placeholders/
  - tests/fixtures/placeholders/
ignoredFindingIds:
  - ACKIT003
